[project]
name = "orion-backend"
version = "0.1.0"
description = "FastAPI backend for orion"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "filterpy>=1.4.5",
    "pytest>=8.4.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]==0.34.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.pytest.ini_options]
pythonpath = ["."]
