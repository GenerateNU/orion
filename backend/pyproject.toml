[project]
name = "orion-backend"
version = "0.1.0"
description = "FastAPI backend for Orion"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.pytest.ini_options]
pythonpath = ["."]
