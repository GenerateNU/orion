name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "packages/**"
      - "services/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docker-compose.yml"
      - ".github/workflows/BackendCI.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/**"
      - "services/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docker-compose.yml"
      - ".github/workflows/BackendCI.yml"

jobs:
  lint-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dev tools
        run: uv sync --frozen --only-dev

      - name: Run ruff
        run: uv run --no-sync ruff check packages services

      - name: Check formatting
        run: uv run --no-sync ruff format --check packages services

      - name: Run pydoclint
        run: uv run --no-sync pydoclint packages services

  typecheck-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # mypy needs the workspace's runtime dependencies to check calls against them.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run mypy
        run: uv run --no-sync mypy

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start test database
        run: docker compose up -d --wait --wait-timeout 60 test-db

      - name: Build backend image
        run: docker compose build backend

      - name: Run linting
        run: docker compose run --rm backend uv run --no-sync ruff check .

      - name: Run tests with coverage
        run: docker compose run --rm backend uv run --no-sync pytest --cov=services --cov=main --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=90
      
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/

      - name: Stop containers
        if: always()
        run: docker compose down