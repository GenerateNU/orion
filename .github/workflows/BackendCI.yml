name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/BackendCI.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/BackendCI.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start test database
        run: docker compose up -d test-db

      - name: Wait for database to be ready
        run: |
          docker compose wait test-db

      - name: Build backend image
        run: docker compose build backend

      - name: Run linting
        run: docker compose run --rm backend uv run ruff check .

      - name: Run tests with coverage
        run: docker compose run --rm backend uv run pytest --cov=services --cov=main --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=90
      
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/

      - name: Stop containers
        if: always()
        run: docker compose down