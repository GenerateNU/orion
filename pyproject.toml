[project]
name = "orion"
version = "0.1.0"
description = "Orion workspace root: shared core package plus backend and pipeline services"
requires-python = ">=3.13,<3.14"
dependencies = [
    "orion-backend-service",
    "orion-core",
    "orion-pipeline",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
orion-core = { workspace = true }
orion-backend-service = { workspace = true }
orion-pipeline = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["backend", "frontend"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
# B008: FastAPI's Depends()/Query() in argument defaults is the intended pattern.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["orion_core", "orion_backend", "orion_pipeline"]

[tool.pytest.ini_options]
testpaths = ["services/backend/tests", "services/pipeline/tests"]
addopts = "--import-mode=importlib"
