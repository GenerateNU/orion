# Orion local stack.
#
#     orion-db   local OrionDB (Postgres)                         localhost:5434
#     backend    backend + pipeline API + pipeline worker (docker/backend.Dockerfile);
#                  migrations and sensor seed on start            http://localhost:8100/docs
#     frontend   built frontend on nginx, /api/* -> backend
#                  (docker/frontend.Dockerfile)                   http://localhost:3000
#
# Point at Neon / Penelope by setting ORION_DATABASE_URL and PENELOPE_DATABASE_URL
# in .env. Without them, OrionDB defaults to the local orion-db container.

services:
  orion-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion
      POSTGRES_DB: orion
    ports:
      - "5434:5432"
    volumes:
      - orion-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    image: orion-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      ORION_DATABASE_URL: ${ORION_DATABASE_URL:-postgresql://orion:orion@orion-db:5432/orion}
      PENELOPE_DATABASE_URL: ${PENELOPE_DATABASE_URL:-}
      PIPELINE_API_URL: http://localhost:8200
    ports:
      - "8100:8000"
    depends_on:
      orion-db:
        condition: service_healthy

  frontend:
    image: orion-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  orion-db-data:
