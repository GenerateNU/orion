# Orion local stack.
#
#     orion-db   local OrionDB (Postgres)                         localhost:5434
#     orion      all-in-one app container (docker/orion.Dockerfile):
#                  migrations on start, then backend + built frontend,
#                  pipeline API and pipeline worker                http://localhost:8100
#                                                                  http://localhost:8100/docs
#
# Point at Neon / Penelope by setting ORION_DATABASE_URL and PENELOPE_DATABASE_URL
# in .env. Without them, OrionDB defaults to the local orion-db container.

services:
  orion-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion
      POSTGRES_DB: orion
    ports:
      - "5434:5432"
    volumes:
      - orion-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 2s
      timeout: 5s
      retries: 15

  orion:
    image: orion
    build:
      context: .
      dockerfile: docker/orion.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      ORION_DATABASE_URL: ${ORION_DATABASE_URL:-postgresql://orion:orion@orion-db:5432/orion}
      PENELOPE_DATABASE_URL: ${PENELOPE_DATABASE_URL:-}
      PIPELINE_API_URL: http://localhost:8200
    ports:
      - "8100:8000"
    depends_on:
      orion-db:
        condition: service_healthy

volumes:
  orion-db-data:
