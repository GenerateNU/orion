[project]
name = "orion-core"
version = "0.1.0"
description = "Shared Orion code: settings, OrionDB models + migrations, Penelope tables, queries"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
